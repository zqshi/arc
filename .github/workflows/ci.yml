name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/src

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
          POSTGRES_DB: arc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ARC_DATABASE_URL: postgresql+asyncpg://arc:arc@localhost:5432/arc_test
      ARC_JWT_SECRET: ci-test-secret-do-not-use-in-production
      ARC_SMS_MOCK_MODE: "true"
      ARC_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd backend && pip install -e ".[dev]"
      - run: cd backend && pytest -x --tb=short

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc -b --noEmit
      - run: cd frontend && npm run build
      - run: cd frontend && npm test

  docs-freshness:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check documentation freshness
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)

          WARN=0

          # Rule 1: domain/routes changed but no docs updated
          if echo "$CHANGED" | grep -qE "backend/src/arc/(domain|interface/routes)/"; then
            if ! echo "$CHANGED" | grep -qE "(docs/|README|CHANGELOG)"; then
              echo "::warning::Domain or route files changed without updating documentation"
              WARN=1
            fi
          fi

          # Rule 2: Docker/compose changed but README not updated
          if echo "$CHANGED" | grep -qE "(docker-compose|Dockerfile)"; then
            if ! echo "$CHANGED" | grep -q "README"; then
              echo "::warning::Docker configuration changed without updating README"
              WARN=1
            fi
          fi

          # Rule 3: config.py changed but .env.example not updated
          if echo "$CHANGED" | grep -q "config.py"; then
            if ! echo "$CHANGED" | grep -q ".env.example"; then
              echo "::warning::config.py changed without updating .env.example"
              WARN=1
            fi
          fi

          if [ $WARN -eq 0 ]; then
            echo "Documentation freshness check passed"
          fi
