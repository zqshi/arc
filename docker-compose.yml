services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arc}
      POSTGRES_DB: ${POSTGRES_DB:-arc}
    ports:
      - "${ARC_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ARC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-arc}:${POSTGRES_PASSWORD:-arc}@db:5432/${POSTGRES_DB:-arc}
      ARC_DEBUG: "false"
      ARC_JWT_SECRET: ${ARC_JWT_SECRET:-}
      # v6.7: 多 worker 测试时配 redis://redis:6379/0, 空则单 worker
      ARC_REDIS_URL: ${ARC_REDIS_URL:-}
      # v6.7: OpenSandbox 云沙箱 (mode=open_sandbox 时启用)
      ARC_OPENSANDBOX_URL: ${ARC_OPENSANDBOX_URL:-}
      ARC_OPENSANDBOX_API_KEY: ${ARC_OPENSANDBOX_API_KEY:-}
      ARC_OPENSANDBOX_IMAGE: ${ARC_OPENSANDBOX_IMAGE:-python:3.12-slim}
      ARC_SMS_MOCK_MODE: ${ARC_SMS_MOCK_MODE:-true}
      ARC_LLM_PROVIDER: ${ARC_LLM_PROVIDER:-openai}
      ARC_OPENAI_API_KEY: ${ARC_OPENAI_API_KEY:-}
      ARC_OPENAI_BASE_URL: ${ARC_OPENAI_BASE_URL:-https://api.openai.com/v1}
      ARC_OPENAI_MODEL: ${ARC_OPENAI_MODEL:-gpt-4o}
      ARC_ANTHROPIC_API_KEY: ${ARC_ANTHROPIC_API_KEY:-}
      ARC_ANTHROPIC_BASE_URL: ${ARC_ANTHROPIC_BASE_URL:-}
      ARC_ANTHROPIC_MODEL: ${ARC_ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      ARC_DEEPSEEK_API_KEY: ${ARC_DEEPSEEK_API_KEY:-}
      ARC_DEEPSEEK_BASE_URL: ${ARC_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      ARC_DEEPSEEK_MODEL: ${ARC_DEEPSEEK_MODEL:-deepseek-chat}
      ARC_OPENHANDS_URL: http://openhands:3000
      ARC_OPENHANDS_API_KEY: ${ARC_OPENHANDS_API_KEY:-}
      ARC_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3001"]'
      ARC_STORAGE_ENDPOINT: ${ARC_STORAGE_ENDPOINT:-http://minio:9000}
      ARC_STORAGE_ACCESS_KEY: ${ARC_STORAGE_ACCESS_KEY:-minioadmin}
      ARC_STORAGE_SECRET_KEY: ${ARC_STORAGE_SECRET_KEY:-minioadmin}
      ARC_STORAGE_BUCKET: ${ARC_STORAGE_BUCKET:-arc-previews}
      ARC_STORAGE_PUBLIC_URL: ${ARC_STORAGE_PUBLIC_URL:-http://localhost:9000/arc-previews}
      # 本地存储模式(无 storage_endpoint)预览目录; prod 已配 MinIO 走对象存储, 此为兜底
      ARC_PREVIEW_STATIC_DIR: ${ARC_PREVIEW_STATIC_DIR:-/app/data/static/previews}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  opensandbox:
    # v6.7: OpenSandbox 云沙箱 server (可选, mode=open_sandbox 时启用)
    # 本地开发用官方 server; 生产可指向自建或外部
    image: opensandbox/server:latest
    ports:
      - "8080:8080"
    volumes:
      - opensandbox_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    # v6.7: 跨进程事件总线 (可选, 多 worker 测试用; 不配 ARC_REDIS_URL 则单 worker InMemory)
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:latest
    ports:
      - "3000:3000"
    environment:
      SANDBOX_RUNTIME_CONTAINER_IMAGE: docker.all-hands.dev/all-hands-ai/runtime:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openhands_data:/opt/workspace_base

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ARC_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${ARC_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
  openhands_data:
  minio_data:
  redis_data:
  opensandbox_data:
