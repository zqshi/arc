apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: arc-db
  namespace: arc
  labels:
    app.kubernetes.io/name: arc-db
    app.kubernetes.io/part-of: arc
spec:
  serviceName: arc-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arc-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arc-db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          envFrom:
            - secretRef:
                name: arc-secrets
          ports:
            - containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: arc-db
  namespace: arc
spec:
  selector:
    app.kubernetes.io/name: arc-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
