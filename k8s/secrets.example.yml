# 部署时: cp secrets.example.yml secrets.yml 后填真实值 (kustomization.yml 引用 secrets.yml)
apiVersion: v1
kind: Secret
metadata:
  name: arc-secrets
  namespace: arc
type: Opaque
stringData:
  # ── 数据库 (arc-db 初始化用 POSTGRES_*, backend 用 ARC_DATABASE_URL, 两者须一致) ──
  POSTGRES_USER: "arc"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "arc"
  ARC_DATABASE_URL: "postgresql+asyncpg://arc:CHANGE_ME@arc-db:5432/arc"

  # ── 认证 ──
  ARC_JWT_SECRET: "CHANGE_ME_64_CHAR_RANDOM_STRING"
  ARC_CORS_ORIGINS: '["https://your-domain.com"]'
  # 签名凭证加密密钥 (v6.1): 空=dev 降级明文, 生产必配
  # 生成: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  ARC_SIGNING_SECRET_KEY: ""

  # ── LLM Keys (configure at least one) ──
  ARC_OPENAI_API_KEY: ""
  ARC_ANTHROPIC_API_KEY: ""
  ARC_DEEPSEEK_API_KEY: ""
  ARC_CODEX_API_KEY: ""

  # ── 对象存储 (arc-minio 服务名) ──
  ARC_STORAGE_ENDPOINT: "http://arc-minio:9000"
  ARC_STORAGE_ACCESS_KEY: "minioadmin"
  ARC_STORAGE_SECRET_KEY: "CHANGE_ME"
  ARC_STORAGE_PUBLIC_URL: ""

  # ── BaaS / Supabase (启用 BaaS 功能时必填) ──
  ARC_SUPABASE_DB_URL: ""
  ARC_SUPABASE_ANON_KEY: ""

  # ── OpenSandbox (arc-opensandbox 服务名) ──
  ARC_OPENSANDBOX_URL: "http://arc-opensandbox:8080"
  ARC_OPENSANDBOX_API_KEY: ""

  # ── OpenHands (arc-openhands 服务名) ──
  ARC_OPENHANDS_URL: "http://arc-openhands:3000"
  ARC_OPENHANDS_API_KEY: ""
