apiVersion: v1
kind: Secret
metadata:
  name: arc-secrets
  namespace: arc
type: Opaque
stringData:
  # ── REQUIRED ──────────────────────────────────────────
  ARC_DATABASE_URL: "postgresql+asyncpg://arc:CHANGE_ME@your-pg-host:5432/arc"
  ARC_JWT_SECRET: "CHANGE_ME_64_CHAR_RANDOM_STRING"
  ARC_CORS_ORIGINS: '["https://your-domain.com"]'
  # 签名凭证加密密钥 (v6.1): 空=dev 降级明文, 生产必配
  # 生成: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  ARC_SIGNING_SECRET_KEY: ""

  # ── LLM Keys (configure at least one) ────────────────
  ARC_OPENAI_API_KEY: ""
  ARC_ANTHROPIC_API_KEY: ""
  ARC_DEEPSEEK_API_KEY: ""

  # ── Object Storage ───────────────────────────────────
  ARC_STORAGE_ENDPOINT: ""
  ARC_STORAGE_ACCESS_KEY: ""
  ARC_STORAGE_SECRET_KEY: ""
  ARC_STORAGE_PUBLIC_URL: ""

  # ── BaaS / Supabase (启用 BaaS 功能时必填) ────────────
  ARC_SUPABASE_DB_URL: ""
  ARC_SUPABASE_ANON_KEY: ""

  # ── OpenSandbox 云沙箱 (mode=open_sandbox 时必填) ──────
  ARC_OPENSANDBOX_URL: ""
  ARC_OPENSANDBOX_API_KEY: ""

  # ── Agent (optional) ─────────────────────────────────
  ARC_OPENHANDS_URL: ""
  ARC_OPENHANDS_API_KEY: ""
