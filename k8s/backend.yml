apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-backend
  namespace: arc
  labels:
    app.kubernetes.io/name: arc-backend
    app.kubernetes.io/part-of: arc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: arc-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arc-backend
    spec:
      initContainers:
        - name: migrate
          image: arc-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: arc-config
            - secretRef:
                name: arc-secrets
      containers:
        - name: backend
          image: arc-backend:latest
          # v6.7: 多 worker 需 ARC_REDIS_URL (configmap 注入), 无 redis 则改 ARC_WORKERS=1
          command: ["sh", "-c", "uvicorn arc.main:app --host 0.0.0.0 --port 8000 --workers ${ARC_WORKERS}"]
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: arc-config
            - secretRef:
                name: arc-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: arc-backend
  namespace: arc
spec:
  selector:
    app.kubernetes.io/name: arc-backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
