# B7 投产门禁: ingress 启用 TLS + 域名占位标注。
# 部署前: (1) 替换 arc.example.com 为真实域名 (sed 或 kustomize var);
#         (2) helm 装 cert-manager + apply cert-manager-issuer.yml。
# 注: /metrics 不经 ingress (公网不暴露), 仅集群内可达, 配 ARC_PROMETHEUS_TOKEN 纵深防御 (A2)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arc-ingress
  namespace: arc
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # B7: cert-manager 自动签发 TLS (前置: cert-manager + ClusterIssuer 已部署)
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - arc.example.com  # TODO 部署时替换为真实域名
      secretName: arc-tls
  rules:
    - host: arc.example.com  # TODO 部署时替换为真实域名
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: arc-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: arc-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: arc-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arc-frontend
                port:
                  number: 80
