apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yml
  - configmap.yml
  - secrets.yml          # 部署时: cp secrets.example.yml secrets.yml 后填真实值
  - db.yml
  - redis.yml
  - minio.yml
  - opensandbox.yml
  - openhands.yml
  - backend.yml
  - frontend.yml
  - ingress.yml

images:
  - name: arc-backend
    newName: ghcr.io/YOUR_ORG/arc-backend
    newTag: latest
  - name: arc-frontend
    newName: ghcr.io/YOUR_ORG/arc-frontend
    newTag: latest
