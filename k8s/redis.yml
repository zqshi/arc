apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-redis
  namespace: arc
  labels:
    app.kubernetes.io/name: arc-redis
    app.kubernetes.io/part-of: arc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arc-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arc-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: arc-redis
  namespace: arc
spec:
  selector:
    app.kubernetes.io/name: arc-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
